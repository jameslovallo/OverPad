name: Build OverPad

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

env:
  APP_NAME: OverPad
  PACKAGE_NAME: com.aistudio.operpad.k7m2x9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # This project has no committed gradlew wrapper, so pin the Gradle version the
    # project is developed against instead of using whatever the runner ships with.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Restore the one shared signing keystore from the committed base64 file.
    # The exact same keystore signs BOTH the debug and release APKs, so either variant can
    # update the other in place (no INSTALL_FAILED_UPDATE_INCOMPATIBLE / uninstall required).
    #
    # Do not regenerate or replace debug.keystore.base64: a new key means a new signing
    # identity, which breaks updates for every device that already has OverPad installed.
    - name: Restore Shared Signing Keystore
      run: |
        if [ ! -f "debug.keystore.base64" ]; then
          echo "::error::debug.keystore.base64 is missing; refusing to build with an inconsistent signing key."
          exit 1
        fi
        base64 -d debug.keystore.base64 > debug.keystore
        keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null

    # Compute semantic version tag (minimum baseline v1.0.17) and monotonic integer versionCode for Android/Play Store
    - name: Compute App Version
      id: version
      run: |
        LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          NEW_TAG="v1.0.17"
        else
          CLEAN_TAG="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -lt 17 ]; }; then
            NEW_TAG="v1.0.17"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
        fi

        VERSION_NAME="${NEW_TAG#v}"
        VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo "17")
        if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 17 ] 2>/dev/null; then
          VERSION_CODE=17
        fi

        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Computed $APP_NAME ($PACKAGE_NAME) semantic version: $VERSION_NAME"

    # Ensure .env exists for secrets-gradle-plugin (it reads .env, not OS env vars)
    - name: Configure Build Secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        : > .env
        if [ -n "$GEMINI_API_KEY" ]; then
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
        fi

    # Execute unit tests and assemble both debug and release APKs with computed version properties.
    # Both build types read the same restored keystore, so their certificates are identical.
    - name: Build with Gradle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
        STORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android
      run: >
        gradle -Djava.awt.headless=true
        -PversionName="${{ steps.version.outputs.version_name }}"
        -PversionCode="${{ steps.version.outputs.version_code }}"
        testDebugUnitTest assembleDebug assembleRelease

    # Hard guarantee: fail the build if the two APKs do not share the exact same signing
    # certificate. This is what makes in-place updates work.
    - name: Verify APK Signing
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk
        test -f app/build/outputs/apk/release/app-release.apk

        APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner not found"
          exit 1
        fi

        DEBUG_SHA=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*SHA-256 digest: //p' | head -n 1)
        RELEASE_SHA=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -n 1)

        echo "Debug APK certificate SHA-256:   $DEBUG_SHA"
        echo "Release APK certificate SHA-256: $RELEASE_SHA"

        if [ -z "$DEBUG_SHA" ] || [ -z "$RELEASE_SHA" ] || [ "$DEBUG_SHA" != "$RELEASE_SHA" ]; then
          echo "::error::Debug and release APKs are not signed with the same certificate. Updates would require an uninstall."
          exit 1
        fi

    - name: Clean Build Secrets
      if: always()
      run: rm -f .env debug.keystore

    - name: Upload Debug Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: overpad-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: overpad-release
        path: app/build/outputs/apk/release/app-release.apk

    # Auto tag the next patch release and publish both debug and release APKs on push to main/master
    - name: Create Release and Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NEW_TAG="${{ steps.version.outputs.tag }}"
        VERSION_NAME="${{ steps.version.outputs.version_name }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $APP_NAME $VERSION_NAME"
        git push origin "$NEW_TAG"

        DEBUG_APK="OverPad-${VERSION_NAME}-debug.apk"
        RELEASE_APK="OverPad-${VERSION_NAME}-release.apk"
        cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_APK"
        cp "app/build/outputs/apk/release/app-release.apk" "$RELEASE_APK"

        gh release create "$NEW_TAG" "$RELEASE_APK" "$DEBUG_APK" \
          --title "$APP_NAME $VERSION_NAME" \
          --notes "Automatic release $VERSION_NAME for \`$PACKAGE_NAME\` built from commit $(git rev-parse --short HEAD). Both APKs are signed with the same certificate, so release and debug builds can update each other in place."
