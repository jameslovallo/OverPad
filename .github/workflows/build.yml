name: Build OverPad

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

env:
  APP_NAME: OverPad
  PACKAGE_NAME: com.aistudio.operpad.k7m2x9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # This project has no committed gradlew wrapper, so pin the Gradle version the
    # project is developed against instead of using whatever the runner ships with.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Restore the debug keystore from the repository's base64 encoded debug keystore.
    # This guarantees consistent signing across all CI builds and avoids INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    - name: Restore Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "debug.keystore.base64 not found, generating fallback keystore"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    # Configure consistent release keystore (prefers GitHub Secrets when provided,
    # otherwise derives my-upload-key.jks from debug.keystore with alias=upload so both
    # debug and release builds share the exact same certificate across all updates).
    - name: Setup Release Keystore
      id: release_signing
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "Restoring release keystore from RELEASE_KEYSTORE_BASE64 secret"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "use_secrets=true" >> "$GITHUB_OUTPUT"
        else
          echo "RELEASE_KEYSTORE_BASE64 secret not set; deriving consistent release keystore from debug.keystore"
          rm -f my-upload-key.jks
          keytool -importkeystore -noprompt \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -destkeystore my-upload-key.jks \
            -deststorepass android \
            -destkeypass android \
            -destalias upload
          echo "use_secrets=false" >> "$GITHUB_OUTPUT"
        fi

    # Compute semantic version tag and numeric versionCode from repository history
    - name: Compute App Version
      id: version
      run: |
        LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          NEW_TAG="v1.0.0"
        else
          CLEAN_TAG="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
        fi

        VERSION_NAME="${NEW_TAG#v}"
        VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo "1")
        if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 1 ] 2>/dev/null; then
          VERSION_CODE=1
        fi

        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Computed $APP_NAME ($PACKAGE_NAME) version: $NEW_TAG (code $VERSION_CODE)"

    # Ensure .env exists for secrets-gradle-plugin (it reads .env, not OS env vars)
    - name: Configure Build Secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        : > .env
        if [ -n "$GEMINI_API_KEY" ]; then
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
        fi

    # Execute unit tests and assemble both debug and release APKs with computed version properties
    - name: Build with Gradle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ steps.release_signing.outputs.use_secrets == 'true' && secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ steps.release_signing.outputs.use_secrets == 'true' && secrets.KEY_PASSWORD || 'android' }}
      run: >
        gradle -Djava.awt.headless=true
        -PversionName="${{ steps.version.outputs.version_name }}"
        -PversionCode="${{ steps.version.outputs.version_code }}"
        testDebugUnitTest assembleDebug assembleRelease

    - name: Verify APK Signing
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk
        test -f app/build/outputs/apk/release/app-release.apk
        APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -n "$APKSIGNER" ]; then
          echo "Debug APK signer:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo "Release APK signer:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
        else
          echo "Debug APK signer:"
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner:|SHA256:" || true
          echo "Release APK signer:"
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|SHA256:" || true
        fi

    - name: Clean Build Secrets
      if: always()
      run: rm -f .env my-upload-key.jks debug.keystore

    - name: Upload Debug Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: overpad-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: overpad-release
        path: app/build/outputs/apk/release/app-release.apk

    # Auto tag the next patch release and publish both debug and release APKs on push to main/master
    - name: Create Release and Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NEW_TAG="${{ steps.version.outputs.tag }}"
        VERSION_NAME="${{ steps.version.outputs.version_name }}"
        VERSION_CODE="${{ steps.version.outputs.version_code }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $APP_NAME $NEW_TAG"
        git push origin "$NEW_TAG"

        DEBUG_APK="OverPad-${NEW_TAG}-debug.apk"
        RELEASE_APK="OverPad-${NEW_TAG}-release.apk"
        cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_APK"
        cp "app/build/outputs/apk/release/app-release.apk" "$RELEASE_APK"

        gh release create "$NEW_TAG" "$RELEASE_APK" "$DEBUG_APK" \
          --title "$APP_NAME $NEW_TAG" \
          --notes "Automatic release $NEW_TAG (versionCode $VERSION_CODE) for \`$PACKAGE_NAME\` built from commit $(git rev-parse --short HEAD). Includes both release and debug APKs."
