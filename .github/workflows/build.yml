name: Build OperPad

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

env:
  APP_NAME: OperPad
  PACKAGE_NAME: com.aistudio.operpad.k7m2x9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # This project has no committed gradlew wrapper, so pin the Gradle version the
    # project is developed against instead of using whatever the runner ships with.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Restore the debug keystore from the repository's base64 encoded debug keystore.
    # This guarantees consistent signing across all CI builds and avoids INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    - name: Restore Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "debug.keystore.base64 not found, generating fallback keystore"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    # Compute semantic version tag and numeric versionCode from repository history
    - name: Compute App Version
      id: version
      run: |
        LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          NEW_TAG="v1.0.0"
        else
          CLEAN_TAG="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
        fi

        VERSION_NAME="${NEW_TAG#v}"
        VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo "1")
        if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 1 ] 2>/dev/null; then
          VERSION_CODE=1
        fi

        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Computed $APP_NAME ($PACKAGE_NAME) version: $NEW_TAG (code $VERSION_CODE)"

    # Ensure .env exists for secrets-gradle-plugin (it reads .env, not OS env vars)
    - name: Configure Build Secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        : > .env
        if [ -n "$GEMINI_API_KEY" ]; then
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
        fi

    # Execute unit tests and assemble the debug APK with computed version properties
    - name: Build with Gradle
      run: >
        gradle -Djava.awt.headless=true
        -PversionName="${{ steps.version.outputs.version_name }}"
        -PversionCode="${{ steps.version.outputs.version_code }}"
        testDebugUnitTest assembleDebug

    - name: Clean Build Secrets
      if: always()
      run: rm -f .env

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: operpad-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # Auto tag the next patch release and publish a GitHub Release on push to main/master
    - name: Create Release and Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NEW_TAG="${{ steps.version.outputs.tag }}"
        VERSION_NAME="${{ steps.version.outputs.version_name }}"
        VERSION_CODE="${{ steps.version.outputs.version_code }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $APP_NAME $NEW_TAG"
        git push origin "$NEW_TAG"

        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        RELEASE_APK="OperPad-${NEW_TAG}.apk"
        cp "$APK_PATH" "$RELEASE_APK"

        gh release create "$NEW_TAG" "$RELEASE_APK" \
          --title "$APP_NAME $NEW_TAG" \
          --notes "Automatic release $NEW_TAG (versionCode $VERSION_CODE) for \`$PACKAGE_NAME\` built from commit $(git rev-parse --short HEAD)."
